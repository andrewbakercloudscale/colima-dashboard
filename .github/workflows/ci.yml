name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Menu bar helper (swiftc; git-ignored, needed by -tags menubar)
        run: bash scripts/build-menubar.sh
      - name: gofmt
        run: test -z "$(gofmt -l internal cmd web)" || { gofmt -l internal cmd web; exit 1; }
      - name: go vet
        run: go vet ./... && go vet -tags menubar ./...
      - name: go test
        run: go test ./...
      - name: JavaScript syntax
        run: for f in web/*.js scripts/*.js; do node --check "$f"; done
      - name: Shell syntax
        run: bash -n install.sh scripts/*.sh

  # A brand new Mac: click every page before anything is installed, then run the real
  # install.sh and click every page again. This is the path a reader of the blog takes.
  fresh-mac:
    runs-on: macos-15
    needs: checks
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Menu bar helper (swiftc; git-ignored, needed by -tags menubar)
        run: bash scripts/build-menubar.sh
      - name: Playwright (driver only; uses the runner's Google Chrome)
        run: |
          mkdir -p "$RUNNER_TEMP/pw"
          npm --prefix "$RUNNER_TEMP/pw" install --no-save --no-audit --no-fund playwright-core@1.56.0
          echo "PLAYWRIGHT=$RUNNER_TEMP/pw/node_modules/playwright-core" >> "$GITHUB_ENV"
      - name: What the runner already has
        run: |
          for t in brew colima docker kubectl; do printf '%-8s %s\n' "$t" "$(command -v $t || echo missing)"; done
          cat ~/.docker/config.json 2>/dev/null || echo "no ~/.docker/config.json"
      - name: Crawl before install
        run: scripts/ci-crawl.sh before-install
      - name: install.sh (latest release, no login item)
        run: bash install.sh --no-service
      - name: Docker finds Homebrew's plugins
        run: docker buildx version && docker compose version
      - name: install.sh again changes nothing
        run: |
          cp ~/.docker/config.json /tmp/cfg-before
          bash install.sh --no-service
          diff /tmp/cfg-before ~/.docker/config.json
      - name: Crawl after install (colima, no VM)
        run: scripts/ci-crawl.sh after-install
      - name: Logs
        if: failure()
        run: cat "${TMPDIR:-/tmp}/cd-crawl.log" || true

  # The Homebrew formula scripts/update-tap.sh writes, built from the latest release, must pass
  # brew style, install with its dependencies, and pass brew test.
  homebrew-formula:
    runs-on: macos-15
    needs: checks
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - name: Formula for the latest release
        run: |
          V="$(gh release view --json tagName -q .tagName | sed 's/^v//')"
          mkdir -p dist
          gh release download "v$V" -p checksums.txt -D dist
          TAP_DIR="$RUNNER_TEMP/tap" scripts/update-tap.sh "$V"
          git -C "$RUNNER_TEMP/tap" init -q -b main
          git -C "$RUNNER_TEMP/tap" -c user.name=ci -c user.email=ci@localhost add -A
          git -C "$RUNNER_TEMP/tap" -c user.name=ci -c user.email=ci@localhost commit -q -m formula
      - name: brew style, install, test
        run: |
          brew tap andrewbakercloudscale/tap "$RUNNER_TEMP/tap"
          brew style andrewbakercloudscale/tap/colima-dashboard
          HOMEBREW_NO_AUTO_UPDATE=1 brew install andrewbakercloudscale/tap/colima-dashboard
          brew test andrewbakercloudscale/tap/colima-dashboard
          colima-dashboard version
