<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Colima Dashboard</title>
<link rel="icon" href="/static/icon.svg">
<link rel="stylesheet" href="/static/app.css">
<meta name="style-nonce" content="{{STYLE_NONCE}}">
<script src="/static/charts.js" defer></script>
<script src="/static/logfmt.js" defer></script>
<script src="/static/containers.js" defer></script>
<script src="/static/report.js" defer></script>
<script src="/static/app.js" defer></script>
<script src="/static/palette.js" defer></script>
</head>
<body>
<div id="splash" class="splash" aria-hidden="true">
  <div class="splash-card">
    <img src="/static/icon.svg" alt="" width="64" height="64" class="splash-logo">
    <div class="splash-name">Colima Dashboard</div>
    <div class="splash-sub" id="splashsub">Connecting to Colima…</div>
    <div class="splash-bar"><span></span></div>
  </div>
</div>
<div class="app">
  <aside class="side">
    <div class="brand"><img src="/static/icon.svg" alt="" width="28" height="28"><span>Colima Dashboard</span></div>
    <label class="profile-pick">
      <span>Profile</span>
      <select id="profile" aria-label="Colima profile"></select>
    </label>
    <div id="vmstate" class="vmstate" aria-live="polite"></div>
    <nav id="nav">
      <a href="#general" data-tab="general">General</a>
      <a href="#monitor" data-tab="monitor">Monitor</a>
      <a href="#containers" data-tab="containers">Containers</a>
      <a href="#runs" data-tab="runs">Runs and tests</a>
      <a href="#builds" data-tab="builds">Builds</a>
      <a href="#report" data-tab="report">Report</a>
      <a href="#volumes" data-tab="volumes">Volumes</a>
      <a href="#ports" data-tab="ports">Port Forwarding</a>
      <a href="#images" data-tab="images">Images</a>
      <a href="#kubernetes" data-tab="kubernetes">Kubernetes</a>
      <a href="#snapshots" data-tab="snapshots">Snapshots</a>
      <a href="#troubleshooting" data-tab="troubleshooting">Troubleshooting</a>
      <a href="#diagnostics" data-tab="diagnostics">Diagnostics <span id="diagbadge" class="badge" hidden></span></a>
      <a href="#preferences" data-tab="preferences" class="nav-sep">Preferences</a>
    </nav>
    <div class="side-foot" id="versions"></div>
  </aside>
  <main id="main" class="main" tabindex="-1"></main>
</div>

<footer id="statusbar" class="statusbar" aria-label="Status">
  <span id="sb-version"></span>
  <span id="sb-net"></span>
  <span id="sb-k8s"></span>
  <span id="sb-engine"></span>
  <button type="button" id="sb-update" class="sb-update" hidden></button>
  <span class="sb-fill"></span>
  <button type="button" id="sb-job" class="sb-job" hidden aria-label="Show the running task">
    <span id="sb-jobtitle"></span>
    <span class="sb-progress"><span id="sb-jobbar"></span></span>
    <span id="sb-jobtime" class="mono"></span>
  </button>
  <button type="button" id="sb-theme" class="sb-theme" aria-label="Switch to dark mode" title="Switch to dark mode"></button>
</footer>

<section id="jobpanel" class="jobpanel" hidden aria-label="Running task">
  <div id="jobgrip" class="jobgrip" role="separator" aria-orientation="horizontal" aria-label="Resize output (drag, or use the arrow keys)" tabindex="0"></div>
  <header>
    <span id="jobtitle"></span>
    <span id="jobstate" class="pill"></span>
    <button type="button" id="jobmin" class="ghost mini hbtn" aria-expanded="true">Minimise</button>
    <button type="button" id="jobclose" class="ghost mini hbtn" aria-label="Close output">Close</button>
  </header>
  <pre id="joblog" class="log"></pre>
</section>

<div id="modal" class="modal" hidden>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modaltitle">
    <h2 id="modaltitle"></h2>
    <div id="modalbody"></div>
    <div class="modal-actions">
      <button type="button" id="modalcancel" class="ghost">Cancel</button>
      <button type="button" id="modalok"></button>
    </div>
  </div>
</div>

<div id="drawer" class="drawer" hidden>
  <div class="drawer-card" role="dialog" aria-modal="true" aria-labelledby="drawertitle">
    <header>
      <h2 id="drawertitle"></h2>
      <button type="button" id="drawerclose" class="ghost mini hbtn">Close</button>
    </header>
    <div id="drawerbody" class="drawer-body"></div>
  </div>
</div>

<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
