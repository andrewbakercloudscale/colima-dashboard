<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Colima UI</title>
<link rel="icon" href="/static/icon.svg">
<link rel="stylesheet" href="/static/app.css">
<script src="/static/locked.js" defer></script>
</head>
<body class="locked">
<main class="locked-card">
  <img src="/static/icon.svg" alt="" width="48" height="48">
  <h1>Colima UI is locked</h1>
  <p>Only the signed-in link opens Colima UI, so other web pages cannot reach your containers.</p>
  <p><button type="button" id="unlock">Open Colima UI</button></p>
  <p class="muted small" id="unlockmsg">Opens the signed-in link in your default browser, the same as running <code>colima-ui open</code> in a terminal.</p>
</main>
</body>
</html>
